name: keepalive

# 保活 + 可用性探针。
#
# 无服务器平台会在无流量时冻结实例、远端 Postgres（Neon 免费档）也会闲置挂起，
# 二者叠加的结果就是「隔一阵子第一次打开会 500，刷新又好」。
# 定期打一个**会查库**的端点可以把两边都叫醒。
#
# 注意：必须打 /api/ready（会执行 SELECT 1），打 /api/health 没用——它不碰数据库。
#
# GitHub Actions schedule 有数分钟抖动，且仓库 60 天无活动后会被平台自动停用；
# 想要分钟级精度请改用 cron-job.org 或自有服务器 crontab（见 README）。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 唤醒并检查就绪状态
        env:
          BASE_URL: ${{ vars.KEEPALIVE_BASE_URL || 'https://diary.toyempires.top' }}
        run: |
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 45 "$BASE_URL/api/ready")
          echo "HTTP $code"
          cat /tmp/ready.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::站点未就绪（HTTP $code）—— 数据库可能连不上，见上方 checks"
            exit 1
          fi

      - name: 触发任务队列（可选）
        # 没配这个 secret 就跳过整步；配了则顺手把 AI 整理任务的队列也跑一遍
        if: ${{ secrets.JOB_TICK_SECRET != '' }}
        env:
          BASE_URL: ${{ vars.KEEPALIVE_BASE_URL || 'https://diary.toyempires.top' }}
        run: |
          code=$(curl -s -o /tmp/tick.json -w '%{http_code}' --max-time 45 -X POST \
            "$BASE_URL/api/jobs/tick" \
            -H "Authorization: Bearer ${{ secrets.JOB_TICK_SECRET }}")
          echo "HTTP $code"
          cat /tmp/tick.json
          echo
